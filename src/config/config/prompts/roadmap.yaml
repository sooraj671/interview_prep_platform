# Roadmap Generation Prompts
version: "1.0"
description: "Prompts for generating personalized learning roadmaps"

prompts:
  generate_roadmap:
    system_prompt: |
      You are an expert career coach and technical mentor with 15+ years of experience in technology education and career development. 
      You specialize in creating personalized learning roadmaps that help people transition to new technical roles or advance in their careers.

      Your approach is:
      1. Analytical - Break down complex role requirements into specific skills
      2. Practical - Focus on achievable, real-world learning paths
      3. Motivational - Create roadmaps that inspire confidence
      4. Comprehensive - Cover both technical and soft skills
      5. Industry-relevant - Use current technologies and best practices

    user_prompt: |
      Create a personalized learning roadmap for someone preparing for a {target_role} role.

      Current Profile:
      - Experience Level: {experience_level}
      - Current Skills:
      {current_skills}

      Additional Information:
      {additional_info}

      Requirements:
      1. Analyze the skill gaps between current profile and target role
      2. Create a structured learning path with 8-12 topics
      3. Each topic should be realistic and achievable
      4. Include practical exercises and assessments
      5. Consider the experience level when setting difficulty
      6. Focus on industry-relevant skills and technologies
      7. Include both theoretical knowledge and practical application
      8. Provide clear learning objectives for each topic
      9. Estimate realistic time requirements
      10. Include milestone checkpoints
      11. Consider dependencies between topics
      12. Include resources and learning materials

      The roadmap should be motivating, practical, and tailored to the individual's current level and goals.

      Format your response as a structured JSON object with the following schema:
      {{
        "title": "string",
        "description": "string",
        "estimated_duration_weeks": integer,
        "difficulty_level": "beginner|intermediate|advanced",
        "skill_gaps": [
          {{
            "skill": "string",
            "current_level": integer (1-10),
            "target_level": integer (1-10),
            "priority": "high|medium|low",
            "reasoning": "string"
          }}
        ],
        "topics": [
          {{
            "title": "string",
            "description": "string",
            "difficulty": "beginner|intermediate|advanced",
            "estimated_hours": integer,
            "prerequisites": ["string"],
            "learning_objectives": ["string"],
            "content": "string",
            "skills_covered": ["string"],
            "practice_exercises": [
              {{
                "type": "coding|project|reading|quiz",
                "description": "string",
                "estimated_time": integer,
                "resources": ["string"]
              }}
            ],
            "assessment_criteria": ["string"],
            "milestone": boolean
          }}
        ],
        "milestones": [
          {{
            "title": "string",
            "description": "string",
            "week_number": integer,
            "skills_to_master": ["string"],
            "assessment_type": "string"
          }}
        ],
        "resources": [
          {{
            "type": "course|book|tutorial|documentation|tool",
            "title": "string",
            "url": "string",
            "description": "string",
            "difficulty": "beginner|intermediate|advanced"
          }}
        ],
        "success_metrics": ["string"],
        "next_steps": ["string"]
      }}

  regenerate_roadmap:
    system_prompt: |
      You are an expert career coach helping someone update their learning roadmap. 
      The user has already made progress on their current roadmap and wants to regenerate it while preserving their completed work.

      Your approach:
      1. Preserve all completed topics and progress
      2. Update remaining topics based on new requirements
      3. Adjust timeline and difficulty based on demonstrated progress
      4. Maintain continuity in learning path
      5. Address any new skill gaps or requirements

    user_prompt: |
      Update this learning roadmap for {target_role} while preserving completed progress.

      Original Roadmap:
      {original_roadmap}

      Completed Topics:
      {completed_topics}

      Current Progress:
      - Overall completion: {progress_percentage}%
      - Skills improved: {improved_skills}
      - Time spent: {time_spent}

      Update Requirements:
      {update_requirements}

      Please:
      1. Keep all completed topics unchanged
      2. Update remaining topics based on new requirements
      3. Adjust difficulty based on demonstrated progress
      4. Update timeline estimates
      5. Add new topics if needed for the role
      6. Remove topics that are no longer relevant
      7. Ensure smooth transitions between topics

      Format your response as a structured JSON object following the same schema as the original roadmap.

  analyze_progress:
    system_prompt: |
      You are an expert learning analyst who evaluates student progress and provides personalized feedback.
      You excel at identifying patterns, strengths, and areas for improvement in technical skill development.

    user_prompt: |
      Analyze this user's progress on their {target_role} roadmap and provide detailed feedback.

      Roadmap Progress:
      {roadmap_progress}

      Assessment Results:
      {assessment_results}

      Time Spent:
      {time_data}

      Please provide:
      1. Overall progress assessment
      2. Strengths demonstrated
      3. Areas needing improvement
      4. Recommended adjustments to study approach
      5. Estimated readiness for the target role
      6. Specific next steps to focus on

      Format your response as a structured JSON object with the following schema:
      {{
        "overall_assessment": {{
          "readiness_score": integer (0-100),
          "confidence_level": "low|medium|high",
          "estimated_completion_weeks": integer,
          "strengths": ["string"],
          "improvement_areas": ["string"]
        }},
        "skill_analysis": [
          {{
            "skill": "string",
            "current_level": integer (1-10),
            "target_level": integer (1-10),
            "progress_rate": "slow|moderate|fast",
            "recommendations": ["string"]
          }}
        ],
        "topic_feedback": [
          {{
            "topic": "string",
            "completion_status": "completed|in_progress|not_started",
            "mastery_level": integer (0-100),
            "feedback": "string",
            "next_steps": ["string"]
          }}
        ],
        "recommendations": {{
          "focus_areas": ["string"],
          "study_adjustments": ["string"],
          "additional_resources": ["string"],
          "timeline_adjustments": "string"
        }},
        "motivational_message": "string"
      }}
