[build]
builder = "NIXPACKS"

[deploy]
# No health check - let it start naturally
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "api"
sourceDir = "."

[services.variables]
PORT = "8000"
PYTHON_VERSION = "3.11"

# Start command
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
