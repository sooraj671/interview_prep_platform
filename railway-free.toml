[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements-free.txt"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[[services]]
name = "api"
sourceDir = "."

[services.variables]
PORT = "8000"
PYTHON_VERSION = "3.11"
