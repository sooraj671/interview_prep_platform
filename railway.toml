[build]
builder = "NIXPACKS"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "api"
sourceDir = "."

[services.variables.env]
PORT = "8000"
PYTHON_VERSION = "3.11"

# Database Configuration - Supabase
DB_HOST = "aws-1-ap-southeast-1.pooler.supabase.com"
DB_PORT = "5432"
DB_NAME = "postgres"
DB_USER = "postgres.dfymgksznlpyfuueqomg"
DB_PASSWORD = "QpshyJLctAZsLFYl"
DATABASE_URL = "postgresql://postgres.dfymgksznlpyfuueqomg:QpshyJLctAZsLFYl@aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres"

# AI Configuration - Inference.net
INFERENCE_API_KEY = "inference-7879a8ca800d4e39a0395f057f407f90"
INFERENCE_BASE_URL = "https://api.inference.net/v1"
INFERENCE_MODEL = "google/gemma-3-27b-instruct/bf-16"
AI_TEMPERATURE = "0.7"
AI_MAX_TOKENS = "2000"
AI_REQUEST_TIMEOUT = "60"
AI_MAX_RETRIES = "3"

# Application Configuration
APP_NAME = "Interview Preparation Platform"
APP_VERSION = "1.0.0"
APP_ENV = "production"
DEBUG = "false"

# Authentication
JWT_SECRET_KEY = "railway-production-jwt-secret-key-change-in-production"
JWT_ALGORITHM = "HS256"
JWT_ACCESS_TOKEN_EXPIRE_MINUTES = "30"
JWT_REFRESH_TOKEN_EXPIRE_DAYS = "7"

# CORS Configuration
ALLOWED_ORIGINS = "*"
ALLOWED_METHODS = "GET,POST,PUT,DELETE,OPTIONS"
ALLOWED_HEADERS = "*"

# Feature Flags
ENABLE_OAUTH_LOGIN = "true"
ENABLE_RESUME_UPLOAD = "true"
ENABLE_AI_ROADMAPS = "true"
ENABLE_ASSESSMENTS = "true"
ENABLE_SIMULATION_MODE = "true"
ENABLE_LEADERBOARDS = "true"
ENABLE_INTERVIEWER_PROFILES = "true"
ENABLE_ANALYTICS = "true"

# Monitoring
LOG_LEVEL = "info"
ENABLE_METRICS = "true"
ENABLE_TRACING = "false"

# Start command for refactored architecture
startCommand = "./startup.sh"
