[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements-minimal.txt"

[deploy]
# Disable health check temporarily
healthcheckPath = "/"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 1

[[services]]
name = "api"
sourceDir = "."

[services.variables]
PORT = "8000"
